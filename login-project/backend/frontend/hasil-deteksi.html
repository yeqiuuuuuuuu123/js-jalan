  <!-- =========================

  ========================== -->

  <main class="main">

    <div class="header-box">

      <h1>
        Hasil Deteksi Jalan
      </h1>

      <p>
        Monitoring hasil deteksi kerusakan jalan berbasis AI
      </p>

    </div>

    <!-- CARD -->

    <div class="table-card">

      <div class="table-header">

        <h2>
          Monitoring Deteksi Jalan
        </h2>

        <div class="header-action">

          <input
            type="text"
            id="searchInput"
            placeholder="Cari lokasi..."
          >

          <button id="refreshBtn">
            🔄 Refresh Data
          </button>

        </div>

      </div>

      <!-- TABLE -->

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>No</th>

              <th>Tanggal</th>

              <th>Waktu</th>

              <th>Lokasi</th>

              <th>Kerusakan</th>

              <th>Status</th>

              <th id="aksiHeader">Aksi</th>

            </tr>

          </thead>

          <tbody id="tableBody">

            <tr>

              <td
                colspan="7"
                class="empty-data"
              >

                Memuat data...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>
