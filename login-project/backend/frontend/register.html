<!-- register.html -->

<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Deteksi Jalan</title>

  <link rel="stylesheet" href="register.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <div class="bg-gradient"></div>

  <div class="register-container">

    <div class="left-side">

      <div class="left-content">

        <img
          src="road-ai.png"
          alt="Road AI"
          class="hero-image"
        >

        <h1 class="hero-title">
          Deteksi Jalan AI
        </h1>

        <p class="hero-desc">
          Sistem monitoring kerusakan jalan modern berbasis Artificial Intelligence secara realtime dan akurat.
        </p>

      </div>

    </div>

    <div class="right-side">

      <div class="register-card">

        <h2>Register</h2>

        <p class="subtitle">
          Buat akun baru Anda
        </p>

        <div class="input-group">

          <label>Username</label>

          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
          >

        </div>

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Masukkan email"
          >

        </div>

        <div class="input-group">

          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
          >

        </div>

        <button id="btnRegister">
          Daftar
        </button>
        <p id="message"></p>

        <p class="login-link">

          Sudah punya akun?

          <a href="login.html">
            Login sekarang
          </a>

        </p>

      </div>

    </div>

  </div>

  <script src="register.js"></script>

</body>
</html>
