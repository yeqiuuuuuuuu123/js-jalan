<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Change Password</title>

  <link rel="stylesheet" href="change-password.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

  <div class="bg"></div>

  <div class="container">

    <!-- LEFT -->

    <div class="left">

      <div class="logo-box">

        <h1>Deteksi Jalan</h1>

        <p>AI Monitoring System</p>

      </div>

      <div class="hero">

        <img
          src="road-ai.png"
          alt="AI"
          class="illustration"
        >

        <h2 class="hero-title">

          <span class="gradient">
            Security System
          </span>

        </h2>

        <p class="hero-desc">
          Lindungi akun Anda dengan password yang kuat dan aman.
        </p>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="right">

      <div class="password-card">

        <h2>Password</h2>

        <p class="subtitle">
          Ganti password akun Anda
        </p>

        <!-- OLD PASSWORD -->

        <div class="input-group">

          <label>Password Lama</label>

          <div class="input-box">

            <input
              type="password"
              id="oldPassword"
              placeholder="Masukkan password lama"
            >

          </div>

        </div>

        <!-- NEW PASSWORD -->

        <div class="input-group">

          <label>Password Baru</label>

          <div class="input-box">

            <input
              type="password"
              id="newPassword"
              placeholder="Masukkan password baru"
            >

          </div>

        </div>

        <div class="input-group">

          <label>Konfirmasi Password</label>

          <div class="input-box">

            <input
              type="password"
              id="confirmPassword"
              placeholder="Ulangi password baru"
            >

          </div>

        </div>


        <button id="changeBtn">

          <span>Update Password</span>

        </button>

        <p id="message"></p>

        <p class="back-link">

          <a href="my-account.html">
            ← Kembali ke My Account
          </a>

        </p>

      </div>

    </div>

  </div>

  <script src="change-password.js"></script>

</body>
</html>
